<svg width="440" height="196" viewBox="0 0 440 196" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Projekt: Spotify kontra YouTube (R, spotifyr, Selenium, tidyverse)">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, "Courier New", monospace; }
  </style>

  <rect width="440" height="196" rx="20" fill="#15151D" />

  <!-- Equalizer icon -->
  <g transform="translate(24, 39) scale(1,-1)" fill="#A78BFA">
    <rect x="0"  y="0" width="3" height="10" rx="1.5"><animate attributeName="height" values="10;4;12;6;10" dur="1.3s" repeatCount="indefinite" /></rect>
    <rect x="5"  y="0" width="3" height="6"  rx="1.5"><animate attributeName="height" values="6;12;5;10;6"  dur="1.1s" repeatCount="indefinite" /></rect>
    <rect x="10" y="0" width="3" height="12" rx="1.5"><animate attributeName="height" values="12;6;9;4;12" dur="1.5s" repeatCount="indefinite" /></rect>
    <rect x="15" y="0" width="3" height="7"  rx="1.5"><animate attributeName="height" values="7;11;4;12;7"  dur="1.0s" repeatCount="indefinite" /></rect>
  </g>
  <text class="sans" x="50" y="38" font-size="11" font-weight="600" letter-spacing="1.5" fill="#64748B">PROJEKT · SPOTIFY I YOUTUBE</text>

  <!-- Arrow (whole card links to the repository) -->
  <g transform="translate(398, 22)" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 14 14 4" /><path d="M6 4h8v8" />
  </g>

  <text class="sans" x="24" y="74" font-size="21" font-weight="800" fill="#F8FAFC">Spotify kontra YouTube</text>
  <text class="sans" x="24" y="104" font-size="13" fill="#94A3B8">Najpopularniejsze piosenki na obu platformach.</text>
  <text class="sans" x="24" y="124" font-size="13" fill="#94A3B8">Dane ze Spotify API i scraperów w Selenium, analiza w R.</text>

  <!-- Tags -->
  <g class="mono" font-size="11" font-weight="600" fill="#C4B5FD" text-anchor="middle">
    <rect x="24"  y="146" width="28" height="26" rx="13" fill="#1C1C26" stroke="#2A2A35" /><text x="38"  y="163">R</text>
    <rect x="60"  y="146" width="76" height="26" rx="13" fill="#1C1C26" stroke="#2A2A35" /><text x="98"  y="163">spotifyr</text>
    <rect x="144" y="146" width="76" height="26" rx="13" fill="#1C1C26" stroke="#2A2A35" /><text x="182" y="163">Selenium</text>
    <rect x="228" y="146" width="82" height="26" rx="13" fill="#1C1C26" stroke="#2A2A35" /><text x="269" y="163">tidyverse</text>
  </g>
</svg>
