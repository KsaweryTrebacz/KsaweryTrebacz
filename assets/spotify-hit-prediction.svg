<svg width="440" height="196" viewBox="0 0 440 196" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Projekt: predykcja hitów ze Spotify (R, tidymodels, XGBoost, DALEX)">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, "Courier New", monospace; }
  </style>

  <rect width="440" height="196" rx="20" fill="#15151D" />

  <!-- Equalizer icon -->
  <g transform="translate(24, 39) scale(1,-1)" fill="#A78BFA">
    <rect x="0"  y="0" width="3" height="8"  rx="1.5"><animate attributeName="height" values="5;12;7;10;5"  dur="1.2s" repeatCount="indefinite" /></rect>
    <rect x="5"  y="0" width="3" height="12" rx="1.5"><animate attributeName="height" values="12;4;10;6;12" dur="1.0s" repeatCount="indefinite" /></rect>
    <rect x="10" y="0" width="3" height="6"  rx="1.5"><animate attributeName="height" values="6;11;5;12;6"  dur="1.4s" repeatCount="indefinite" /></rect>
    <rect x="15" y="0" width="3" height="10" rx="1.5"><animate attributeName="height" values="10;5;12;7;10" dur="1.1s" repeatCount="indefinite" /></rect>
  </g>
  <text class="sans" x="50" y="38" font-size="11" font-weight="600" letter-spacing="1.5" fill="#64748B">PROJEKT · DANE SPOTIFY</text>

  <!-- Arrow (whole card links to the repository) -->
  <g transform="translate(398, 22)" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 14 14 4" /><path d="M6 4h8v8" />
  </g>

  <text class="sans" x="24" y="74" font-size="21" font-weight="800" fill="#F8FAFC">Predykcja hitów ze Spotify</text>
  <text class="sans" x="24" y="104" font-size="13" fill="#94A3B8">Czy utwór będzie hitem? Klasyfikacja na danych Spotify.</text>
  <text class="sans" x="24" y="124" font-size="13" fill="#94A3B8">Regresja logistyczna, las losowy, XGBoost i SMOTE.</text>

  <!-- Tags -->
  <g class="mono" font-size="11" font-weight="600" fill="#C4B5FD" text-anchor="middle">
    <rect x="24"  y="146" width="28" height="26" rx="13" fill="#1C1C26" stroke="#2A2A35" /><text x="38"  y="163">R</text>
    <rect x="60"  y="146" width="88" height="26" rx="13" fill="#1C1C26" stroke="#2A2A35" /><text x="104" y="163">tidymodels</text>
    <rect x="156" y="146" width="68" height="26" rx="13" fill="#1C1C26" stroke="#2A2A35" /><text x="190" y="163">XGBoost</text>
    <rect x="232" y="146" width="56" height="26" rx="13" fill="#1C1C26" stroke="#2A2A35" /><text x="260" y="163">DALEX</text>
  </g>
</svg>
