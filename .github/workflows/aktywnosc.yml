name: Wykres aktywności

on:
  schedule: [{cron: "17 4 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/activity_chart.py"
      - ".github/workflows/aktywnosc.yml"

permissions:
  contents: write

jobs:
  wykres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generowanie wykresu
        run: python3 .github/scripts/activity_chart.py "${{ github.repository_owner }}"

      - name: Zapis zmian
        run: |
          if git diff --quiet -- assets/aktywnosc.svg; then
            echo "Wykres bez zmian."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/aktywnosc.svg
          git commit -m "Aktualizacja wykresu aktywności"
          git push
