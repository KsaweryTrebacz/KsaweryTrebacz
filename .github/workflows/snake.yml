name: Generate Snake

on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generowanie animacji węża
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2322D3EE&color_dots=%23030712,%230e7490,%2222D3EE,%237C3AED,%2310B981

      - name: Publikacja do gałęzi output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
