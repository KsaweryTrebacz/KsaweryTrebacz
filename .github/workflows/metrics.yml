name: Metrics
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generowanie statystyk
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Podstawowe ustawienia
          user: KsaweryTrebacz # <--- Upewnij się, że tu jest Twój nick
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Warsaw
          
          # TUTAJ: Dodałem 'music' na sam koniec listy wyświetlania
          config_order: base.header, languages, habits, isocalendar, music

          # Wtyczka: Języki
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          
          # Wtyczka: Linie kodu
          plugin_lines: yes

          # Wtyczka: Nawyki kodowania
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14

          # Wtyczka: Kalendarz 3D
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # TUTAJ: Włączona sekcja Spotify (pobiera dane z Twojego Secretu)
          plugin_music: yes
          plugin_music_provider: spotify
          plugin_music_mode: latest                  # Pokazuje aktualnie lub ostatnio grany utwór
          plugin_music_played_at: yes                 # Pokazuje czas, kiedy leciał kawałek
          plugin_music_token: "${{ secrets.SPOTIFY_TOKENS }}"
