name: Metrics
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generowanie kalendarza 3D
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: KsaweryTrebacz
          template: classic
          config_timezone: Europe/Warsaw

          # Tylko kalendarz izometryczny – bez sekcji bazowych i modułu "habits",
          # który kończył się błędem "Unexpected error".
          base: ""
          config_display: large

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
