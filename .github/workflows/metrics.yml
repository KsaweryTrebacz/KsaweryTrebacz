name: Metrics
on:
  schedule: [{cron: "0 */12 * * "}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generowanie statystyk
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Podstawowe ustawienia
          user: TWOJ_NICK # <--- Upewnij się, że tu jest Twój nick
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Warsaw
          
          # Ustawienie kolejności (tylko to, co jest faktycznie włączone)
          config_order: base.header, languages, habits, isocalendar

          # Wtyczka: Języki
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          
          # Wtyczka: Linie kodu
          plugin_lines: yes

          # Wtyczka: Nawyki kodowania (naprawiony błąd)
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14

          # Wtyczka: Kalendarz 3D
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
