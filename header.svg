<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cześć, tu Ksawery! QA Engineer, Automation Tester">
  <defs>
    <!-- Glow orbs (violet only) -->
    <radialGradient id="orb-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb-lilac" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0" />
    </radialGradient>

    <!-- Animated accent gradient (shades of violet) -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#A78BFA" />
      <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="1;0;1" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Vertical gradient for equalizer bars (bars are drawn flipped, so y=0 is the bottom) -->
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>

    <!-- Progress bar gradient -->
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="card-left">
      <rect width="300" height="324" rx="22" />
    </clipPath>

    <!-- Typewriter clip: width follows the text being "typed" -->
    <clipPath id="type-clip">
      <rect x="0" y="-26" width="0" height="34">
        <animate attributeName="width"
          values="0;146;146;0;214;214;0;150;150;0"
          keyTimes="0;0.1;0.28;0.333;0.433;0.613;0.667;0.767;0.947;1"
          dur="12s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, "Courier New", monospace; }
  </style>

  <!-- ============ Background ============ -->
  <rect width="900" height="380" fill="#0A0A0F" />

  <circle cx="760" cy="320" r="460" fill="url(#orb-violet)">
    <animate attributeName="cy" values="320;240;320" dur="16s" repeatCount="indefinite" />
  </circle>
  <circle cx="160" cy="80" r="420" fill="url(#orb-lilac)">
    <animate attributeName="cx" values="160;240;160" dur="14s" repeatCount="indefinite" />
  </circle>

  <!-- Floating particles -->
  <g fill="#A78BFA">
    <circle cx="70" cy="340" r="1.6"><animate attributeName="cy" values="340;40" dur="16s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.6;0" dur="16s" repeatCount="indefinite" /></circle>
    <circle cx="340" cy="370" r="2"><animate attributeName="cy" values="370;60" dur="21s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.5;0" dur="21s" repeatCount="indefinite" /></circle>
    <circle cx="610" cy="360" r="1.2"><animate attributeName="cy" values="360;30" dur="13s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.7;0" dur="13s" repeatCount="indefinite" /></circle>
    <circle cx="860" cy="300" r="2.4"><animate attributeName="cy" values="300;20" dur="19s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.4;0" dur="19s" repeatCount="indefinite" /></circle>
    <circle cx="480" cy="330" r="1.4" fill="#7C3AED"><animate attributeName="cy" values="330;50" dur="17s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.7;0" dur="17s" repeatCount="indefinite" /></circle>
  </g>

  <!-- ============ LEFT: terminal with a Playwright run ============ -->
  <g transform="translate(28, 28)">
    <rect width="300" height="324" rx="22" fill="#15151D" fill-opacity="0.85" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="22" y="0" width="256" height="2" rx="1" fill="url(#accent)" opacity="0.9" />

    <!-- Window chrome -->
    <circle cx="26" cy="26" r="5" fill="#3A3A46" />
    <circle cx="44" cy="26" r="5" fill="#52525E" />
    <circle cx="62" cy="26" r="5" fill="#7C3AED" />
    <text class="mono" x="150" y="30" font-size="11" fill="#64748B" text-anchor="middle">~/projekt — e2e</text>

    <g class="mono" font-size="12.5">
      <!-- 1. command -->
      <text x="24" y="70" fill="#F8FAFC" opacity="0">
        <tspan fill="#A78BFA">$</tspan> npx playwright test
        <animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.3s" fill="freeze" />
      </text>

      <!-- 2. info line -->
      <text x="24" y="94" fill="#64748B" opacity="0">
        Running 24 tests using 4 workers
        <animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.3s" fill="freeze" />
      </text>

      <!-- progress bar -->
      <rect x="24" y="106" width="252" height="4" rx="2" fill="rgba(255,255,255,0.08)" opacity="0">
        <animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.3s" fill="freeze" />
      </rect>
      <rect x="24" y="106" width="0" height="4" rx="2" fill="url(#progress)">
        <animate attributeName="width" values="0;252" begin="1.1s" dur="2.8s" fill="freeze" />
      </rect>

      <!-- 3-6. spec files -->
      <text x="24" y="138" fill="#94A3B8" opacity="0">
        <tspan fill="#A78BFA" font-weight="700">✓</tspan> auth/login.spec.ts
        <animate attributeName="opacity" values="0;1" begin="1.5s" dur="0.3s" fill="freeze" />
      </text>
      <text x="24" y="162" fill="#94A3B8" opacity="0">
        <tspan fill="#A78BFA" font-weight="700">✓</tspan> cart/checkout.spec.ts
        <animate attributeName="opacity" values="0;1" begin="2.1s" dur="0.3s" fill="freeze" />
      </text>
      <text x="24" y="186" fill="#94A3B8" opacity="0">
        <tspan fill="#A78BFA" font-weight="700">✓</tspan> api/orders.spec.ts
        <animate attributeName="opacity" values="0;1" begin="2.7s" dur="0.3s" fill="freeze" />
      </text>
      <text x="24" y="210" fill="#94A3B8" opacity="0">
        <tspan fill="#A78BFA" font-weight="700">✓</tspan> ui/navigation.spec.ts
        <animate attributeName="opacity" values="0;1" begin="3.3s" dur="0.3s" fill="freeze" />
      </text>

      <!-- 7. summary -->
      <text x="24" y="242" fill="#F8FAFC" font-weight="700" opacity="0">
        24 passed <tspan fill="#64748B" font-weight="400">(14.2s)</tspan>
        <animate attributeName="opacity" values="0;1" begin="4.0s" dur="0.4s" fill="freeze" />
      </text>

      <!-- 8. idle prompt with blinking cursor -->
      <text x="24" y="272" fill="#A78BFA" opacity="0">
        $
        <animate attributeName="opacity" values="0;1" begin="4.4s" dur="0.3s" fill="freeze" />
      </text>
      <rect x="38" y="261" width="8" height="14" fill="#A78BFA" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="4.4s" repeatCount="indefinite" calcMode="discrete" />
      </rect>
    </g>

    <!-- Scanline -->
    <g clip-path="url(#card-left)">
      <rect width="300" height="3" fill="#A78BFA" opacity="0.10">
        <animate attributeName="y" values="-3;324" dur="5s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- ============ RIGHT: about me ============ -->
  <g transform="translate(352, 28)">
    <rect width="520" height="324" rx="22" fill="#15151D" fill-opacity="0.85" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="22" y="0" width="476" height="2" rx="1" fill="url(#accent)" opacity="0.9" />

    <!-- Mini equalizer (music nod) in the top-right corner -->
    <g transform="translate(446, 56) scale(1,-1)" fill="url(#bar)" filter="url(#glow)" opacity="0.9">
      <rect x="0"  y="0" width="5" height="10" rx="2.5"><animate attributeName="height" values="8;24;12;28;8"  dur="1.3s" begin="-0.1s" repeatCount="indefinite" /></rect>
      <rect x="8"  y="0" width="5" height="18" rx="2.5"><animate attributeName="height" values="18;6;26;14;18" dur="1.1s" begin="-0.5s" repeatCount="indefinite" /></rect>
      <rect x="16" y="0" width="5" height="12" rx="2.5"><animate attributeName="height" values="12;30;8;20;12"  dur="1.5s" begin="-0.9s" repeatCount="indefinite" /></rect>
      <rect x="24" y="0" width="5" height="22" rx="2.5"><animate attributeName="height" values="22;10;30;16;22" dur="1.2s" begin="-0.3s" repeatCount="indefinite" /></rect>
      <rect x="32" y="0" width="5" height="9"  rx="2.5"><animate attributeName="height" values="9;20;6;26;9"   dur="1.4s" begin="-0.7s" repeatCount="indefinite" /></rect>
      <rect x="40" y="0" width="5" height="16" rx="2.5"><animate attributeName="height" values="16;28;12;22;16" dur="1.0s" begin="-0.2s" repeatCount="indefinite" /></rect>
      <rect x="48" y="0" width="5" height="11" rx="2.5"><animate attributeName="height" values="11;6;24;10;11"  dur="1.6s" begin="-1.1s" repeatCount="indefinite" /></rect>
    </g>

    <!-- Greeting -->
    <text class="sans" x="36" y="70" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Cześć, tu Ksawery!</text>

    <!-- Typewriter role -->
    <g transform="translate(36, 110)">
      <g clip-path="url(#type-clip)" class="sans" font-size="24" font-weight="700" fill="url(#accent)">
        <text x="0" y="0" textLength="146">QA Engineer
          <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.333;0.667" dur="12s" repeatCount="indefinite" calcMode="discrete" />
        </text>
        <text x="0" y="0" textLength="214">Automation Tester
          <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.333;0.667" dur="12s" repeatCount="indefinite" calcMode="discrete" />
        </text>
        <text x="0" y="0" textLength="150">AI Enthusiast
          <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333;0.667" dur="12s" repeatCount="indefinite" calcMode="discrete" />
        </text>
      </g>
      <rect x="2" y="-22" width="3" height="28" rx="1.5" fill="#A78BFA">
        <animate attributeName="x"
          values="2;148;148;2;216;216;2;152;152;2"
          keyTimes="0;0.1;0.28;0.333;0.433;0.613;0.667;0.767;0.947;1"
          dur="12s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="1s" repeatCount="indefinite" calcMode="discrete" />
      </rect>
    </g>

    <!-- Details with icons -->
    <g class="sans" font-size="15" font-weight="500" fill="#94A3B8">
      <!-- Lokalizacja -->
      <g transform="translate(36, 155)" opacity="0">
        <g transform="translate(0,-13) scale(0.7)" fill="none" stroke="#A78BFA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" />
        </g>
        <text x="28" y="0">Lokalizacja: <tspan fill="#F8FAFC" font-weight="600">Polska</tspan></text>
        <animate attributeName="opacity" values="0;1" begin="0.8s" dur="0.5s" fill="freeze" />
      </g>
      <!-- Rola -->
      <g transform="translate(36, 184)" opacity="0">
        <g transform="translate(0,-13) scale(0.7)" fill="none" stroke="#A78BFA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="14" x="2" y="7" rx="2" /><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
        </g>
        <text x="28" y="0">Rola: <tspan fill="#F8FAFC" font-weight="600">Praktykant</tspan></text>
        <animate attributeName="opacity" values="0;1" begin="1.1s" dur="0.5s" fill="freeze" />
      </g>
      <!-- Kierunek -->
      <g transform="translate(36, 213)" opacity="0">
        <g transform="translate(0,-13) scale(0.7)" fill="none" stroke="#A78BFA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.42 10.92a1 1 0 0 0-.02-1.84L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.83l8.57 3.91a2 2 0 0 0 1.66 0z" /><path d="M22 10v6" /><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />
        </g>
        <text x="28" y="0">Kierunek: <tspan fill="#F8FAFC" font-weight="600">Inżynieria i analiza danych</tspan></text>
        <animate attributeName="opacity" values="0;1" begin="1.4s" dur="0.5s" fill="freeze" />
      </g>
      <!-- Inżynierka -->
      <g transform="translate(36, 242)" opacity="0">
        <g transform="translate(0,-13) scale(0.7)" fill="none" stroke="#A78BFA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" />
        </g>
        <text x="28" y="0">Inżynierka: <tspan fill="#F8FAFC" font-weight="600">Ekstrakcja cech muzycznych</tspan></text>
        <animate attributeName="opacity" values="0;1" begin="1.7s" dur="0.5s" fill="freeze" />
      </g>
      <!-- Email -->
      <g transform="translate(36, 271)" opacity="0">
        <g transform="translate(0,-13) scale(0.7)" fill="none" stroke="#A78BFA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
        </g>
        <text x="28" y="0">Email: <tspan fill="#F8FAFC" font-weight="600">xavitrem@gazeta.pl</tspan></text>
        <animate attributeName="opacity" values="0;1" begin="2.0s" dur="0.5s" fill="freeze" />
      </g>
    </g>

    <!-- Divider + tagline -->
    <rect x="36" y="290" width="448" height="1" fill="rgba(255,255,255,0.10)" />
    <text class="sans" x="36" y="311" font-size="13" font-style="italic" fill="#64748B" opacity="0">
      Piszę testy, grzebię w danych i zawsze mam coś w słuchawkach.
      <animate attributeName="opacity" values="0;1" begin="2.4s" dur="0.6s" fill="freeze" />
    </text>
  </g>
</svg>
