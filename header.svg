<svg width="900" height="350" viewBox="0 0 900 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cześć, tu Ksawery! QA Engineer, Automation Tester">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.45" />
    </filter>

    <clipPath id="card-left">
      <rect width="300" height="294" rx="24" />
    </clipPath>

    <!-- Typewriter clip: width follows the text being "typed" -->
    <clipPath id="type-clip">
      <rect x="0" y="-26" width="0" height="34">
        <animate attributeName="width"
          values="0;146;146;0;214;214;0;150;150;0"
          keyTimes="0;0.1;0.28;0.333;0.433;0.613;0.667;0.767;0.947;1"
          dur="12s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Consolas, "Courier New", monospace; }
  </style>

  <!-- ============ Background (flat) ============ -->
  <rect width="900" height="350" rx="24" fill="#0A0A0F" />

  <!-- Floating particles -->
  <g fill="#A78BFA">
    <circle cx="70" cy="320" r="1.6"><animate attributeName="cy" values="320;30" dur="16s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.6;0" dur="16s" repeatCount="indefinite" /></circle>
    <circle cx="340" cy="345" r="2"><animate attributeName="cy" values="345;50" dur="21s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.5;0" dur="21s" repeatCount="indefinite" /></circle>
    <circle cx="610" cy="335" r="1.2"><animate attributeName="cy" values="335;25" dur="13s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.7;0" dur="13s" repeatCount="indefinite" /></circle>
    <circle cx="860" cy="280" r="2.4"><animate attributeName="cy" values="280;20" dur="19s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.4;0" dur="19s" repeatCount="indefinite" /></circle>
    <circle cx="480" cy="310" r="1.4" fill="#7C3AED"><animate attributeName="cy" values="310;45" dur="17s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.7;0" dur="17s" repeatCount="indefinite" /></circle>
  </g>

  <!-- ============ LEFT: terminal running the FilmSpringOpen2026 test suite ============ -->
  <g transform="translate(28, 28)">
    <rect width="300" height="294" rx="24" fill="#15151D" stroke="#24242F" stroke-width="1" filter="url(#shadow)" />

    <!-- Window chrome -->
    <circle cx="28" cy="28" r="5" fill="#3A3A46" />
    <circle cx="46" cy="28" r="5" fill="#52525E" />
    <circle cx="64" cy="28" r="5" fill="#7C3AED" />
    <text class="mono" x="162" y="32" font-size="11" fill="#64748B" text-anchor="middle">~/FilmSpringOpen2026</text>

    <g class="mono" font-size="12.5">
      <!-- 1. command -->
      <text x="24" y="68" fill="#F8FAFC" opacity="0">
        <tspan fill="#A78BFA">$</tspan> python -m pytest tests
        <animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.3s" fill="freeze" />
      </text>

      <!-- 2. info line -->
      <text x="24" y="90" fill="#64748B" opacity="0">
        rootdir: FilmSpringOpen2026
        <animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.3s" fill="freeze" />
      </text>

      <!-- progress bar -->
      <rect x="24" y="102" width="252" height="4" rx="2" fill="#24242F" opacity="0">
        <animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.3s" fill="freeze" />
      </rect>
      <rect x="24" y="102" width="0" height="4" rx="2" fill="#7C3AED">
        <animate attributeName="width" values="0;252" begin="1.1s" dur="2.8s" fill="freeze" />
      </rect>

      <!-- 3-6. test files -->
      <text x="24" y="130" fill="#94A3B8" opacity="0">
        <tspan fill="#A78BFA" font-weight="700">✓</tspan> tests/test_engine.py
        <animate attributeName="opacity" values="0;1" begin="1.5s" dur="0.3s" fill="freeze" />
      </text>
      <text x="24" y="152" fill="#94A3B8" opacity="0">
        <tspan fill="#A78BFA" font-weight="700">✓</tspan> tests/test_scenario.py
        <animate attributeName="opacity" values="0;1" begin="2.1s" dur="0.3s" fill="freeze" />
      </text>
      <text x="24" y="174" fill="#94A3B8" opacity="0">
        <tspan fill="#A78BFA" font-weight="700">✓</tspan> tests/test_montage.py
        <animate attributeName="opacity" values="0;1" begin="2.7s" dur="0.3s" fill="freeze" />
      </text>
      <text x="24" y="196" fill="#94A3B8" opacity="0">
        <tspan fill="#A78BFA" font-weight="700">✓</tspan> tests/test_web_player.py
        <animate attributeName="opacity" values="0;1" begin="3.3s" dur="0.3s" fill="freeze" />
      </text>

      <!-- 7. summary (liczba z README projektu FilmSpringOpen2026) -->
      <text x="24" y="226" fill="#F8FAFC" font-weight="700" opacity="0">
        444 passed
        <animate attributeName="opacity" values="0;1" begin="4.0s" dur="0.4s" fill="freeze" />
      </text>

      <!-- 8. idle prompt with blinking cursor -->
      <text x="24" y="256" fill="#A78BFA" opacity="0">
        $
        <animate attributeName="opacity" values="0;1" begin="4.4s" dur="0.3s" fill="freeze" />
      </text>
      <rect x="38" y="245" width="8" height="14" rx="2" fill="#A78BFA" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="4.4s" repeatCount="indefinite" calcMode="discrete" />
      </rect>
    </g>

    <!-- Scanline -->
    <g clip-path="url(#card-left)">
      <rect width="300" height="3" fill="#A78BFA" opacity="0.08">
        <animate attributeName="y" values="-3;294" dur="5s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- ============ RIGHT: about me ============ -->
  <g transform="translate(352, 28)">
    <rect width="520" height="294" rx="24" fill="#15151D" stroke="#24242F" stroke-width="1" filter="url(#shadow)" />

    <!-- Mini equalizer (music nod) in the top-right corner -->
    <g transform="translate(446, 58) scale(1,-1)" fill="#A78BFA">
      <rect x="0"  y="0" width="5" height="10" rx="2.5"><animate attributeName="height" values="8;24;12;28;8"  dur="1.3s" begin="-0.1s" repeatCount="indefinite" /></rect>
      <rect x="8"  y="0" width="5" height="18" rx="2.5"><animate attributeName="height" values="18;6;26;14;18" dur="1.1s" begin="-0.5s" repeatCount="indefinite" /></rect>
      <rect x="16" y="0" width="5" height="12" rx="2.5"><animate attributeName="height" values="12;30;8;20;12"  dur="1.5s" begin="-0.9s" repeatCount="indefinite" /></rect>
      <rect x="24" y="0" width="5" height="22" rx="2.5"><animate attributeName="height" values="22;10;30;16;22" dur="1.2s" begin="-0.3s" repeatCount="indefinite" /></rect>
      <rect x="32" y="0" width="5" height="9"  rx="2.5"><animate attributeName="height" values="9;20;6;26;9"   dur="1.4s" begin="-0.7s" repeatCount="indefinite" /></rect>
      <rect x="40" y="0" width="5" height="16" rx="2.5"><animate attributeName="height" values="16;28;12;22;16" dur="1.0s" begin="-0.2s" repeatCount="indefinite" /></rect>
      <rect x="48" y="0" width="5" height="11" rx="2.5"><animate attributeName="height" values="11;6;24;10;11"  dur="1.6s" begin="-1.1s" repeatCount="indefinite" /></rect>
    </g>

    <!-- Greeting -->
    <text class="sans" x="36" y="70" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Cześć, tu Ksawery!</text>

    <!-- Typewriter role -->
    <g transform="translate(36, 110)">
      <g clip-path="url(#type-clip)" class="sans" font-size="24" font-weight="700" fill="#A78BFA">
        <text x="0" y="0" textLength="146">QA Engineer
          <animate attributeName="opacity" values="1;0;0" keyTimes="0;0.333;0.667" dur="12s" repeatCount="indefinite" calcMode="discrete" />
        </text>
        <text x="0" y="0" textLength="214">Automation Tester
          <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.333;0.667" dur="12s" repeatCount="indefinite" calcMode="discrete" />
        </text>
        <text x="0" y="0" textLength="150">AI Enthusiast
          <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333;0.667" dur="12s" repeatCount="indefinite" calcMode="discrete" />
        </text>
      </g>
      <rect x="2" y="-22" width="3" height="28" rx="1.5" fill="#A78BFA">
        <animate attributeName="x"
          values="2;148;148;2;216;216;2;152;152;2"
          keyTimes="0;0.1;0.28;0.333;0.433;0.613;0.667;0.767;0.947;1"
          dur="12s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="1s" repeatCount="indefinite" calcMode="discrete" />
      </rect>
    </g>

    <!-- Details with icons -->
    <g class="sans" font-size="15" font-weight="500" fill="#94A3B8">
      <!-- Lokalizacja -->
      <g transform="translate(36, 152)" opacity="0">
        <g transform="translate(0,-13) scale(0.7)" fill="none" stroke="#A78BFA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" />
        </g>
        <text x="28" y="0">Lokalizacja: <tspan fill="#F8FAFC" font-weight="600">Polska</tspan></text>
        <animate attributeName="opacity" values="0;1" begin="0.8s" dur="0.5s" fill="freeze" />
      </g>
      <!-- Rola -->
      <g transform="translate(36, 180)" opacity="0">
        <g transform="translate(0,-13) scale(0.7)" fill="none" stroke="#A78BFA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="14" x="2" y="7" rx="2" /><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
        </g>
        <text x="28" y="0">Rola: <tspan fill="#F8FAFC" font-weight="600">Praktykant</tspan></text>
        <animate attributeName="opacity" values="0;1" begin="1.1s" dur="0.5s" fill="freeze" />
      </g>
      <!-- Kierunek -->
      <g transform="translate(36, 208)" opacity="0">
        <g transform="translate(0,-13) scale(0.7)" fill="none" stroke="#A78BFA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.42 10.92a1 1 0 0 0-.02-1.84L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.83l8.57 3.91a2 2 0 0 0 1.66 0z" /><path d="M22 10v6" /><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />
        </g>
        <text x="28" y="0">Kierunek: <tspan fill="#F8FAFC" font-weight="600">Inżynieria i analiza danych</tspan></text>
        <animate attributeName="opacity" values="0;1" begin="1.4s" dur="0.5s" fill="freeze" />
      </g>
      <!-- Inżynierka -->
      <g transform="translate(36, 236)" opacity="0">
        <g transform="translate(0,-13) scale(0.7)" fill="none" stroke="#A78BFA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" />
        </g>
        <text x="28" y="0">Inżynierka: <tspan fill="#F8FAFC" font-weight="600">Ekstrakcja cech muzycznych</tspan></text>
        <animate attributeName="opacity" values="0;1" begin="1.7s" dur="0.5s" fill="freeze" />
      </g>
      <!-- Email -->
      <g transform="translate(36, 264)" opacity="0">
        <g transform="translate(0,-13) scale(0.7)" fill="none" stroke="#A78BFA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
        </g>
        <text x="28" y="0">Email: <tspan fill="#F8FAFC" font-weight="600">xavitrem@gazeta.pl</tspan></text>
        <animate attributeName="opacity" values="0;1" begin="2.0s" dur="0.5s" fill="freeze" />
      </g>
    </g>
  </g>
</svg>
